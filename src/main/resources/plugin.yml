name: VigilAC
version: '${version}'
main: ac.vigil.VigilAC
description: Production-oriented anti-cheat for Paper servers
author: VigilAC
website: https://github.com/TienHeavenVN/VigilAC
api-version: '1.21'
load: POSTWORLD
softdepend:
  - packetevents
commands:
  vigilac:
    description: VigilAC administration command
    usage: /vigilac <info|alerts|check|violations|debug|reload|exempt|monitor|ai|capture|help>
    permission: vigilac.command
permissions:
  vigilac.command:
    description: Entry permission for /vigilac
    default: op
  vigilac.info:
    description: View plugin info, TPS, check list and storage status
    default: op
  vigilac.alerts:
    description: Receive VigilAC alerts (and toggle them with /vigilac alerts)
    default: op
  vigilac.check:
    description: View per-player violation levels
    default: op
  vigilac.violations:
    description: View violation overviews
    default: op
  vigilac.debug:
    description: Toggle per-player detection debug output
    default: op
  vigilac.reload:
    description: Reload config.yml
    default: op
  vigilac.exempt:
    description: Toggle exemptions for players; players with this permission bypass all checks
    default: op
  vigilac.monitor:
    description: View continuous monitoring state and per-check detection status for a player
    default: op
  vigilac.ai:
    description: View AI-assist reports and module status (advisory; never triggers punishment)
    default: op
  vigilac.capture:
    description: Consent/revoke your own capture participation and view capture status
    default: true
  vigilac.capture.admin:
    description: Purge old capture corpus files or delete the whole corpus + consent store
    default: op
