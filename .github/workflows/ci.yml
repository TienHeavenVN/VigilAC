name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile main sources
        run: ./gradlew compileJava --no-daemon --stacktrace

      - name: Compile test sources
        run: ./gradlew compileTestJava --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit tests
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Test failure details (annotations)
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import glob, re, html, os
          found = 0
          for f in glob.glob('build/test-results/test/*.xml'):
              text = open(f, encoding='utf8', errors='replace').read()
              for m in re.finditer(r'<(failure|error)[^>]*message="([^"]*)"', text):
                  found += 1
                  msg = html.unescape(m.group(2)).replace('\n', ' ').replace('\r', ' ')[:600]
                  case = os.path.basename(f)[:-4]
                  print(f'::error title={case}::{msg}')
          if not found:
              print('::error title=NoTestFailures::Test step failed but no failure tags were found in the XML reports')
          PYEOF

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Upload VigilAC.jar
        uses: actions/upload-artifact@v4
        with:
          name: VigilAC
          path: build/libs/VigilAC.jar
          if-no-files-found: error
