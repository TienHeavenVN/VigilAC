name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile main sources
        run: ./gradlew compileJava --no-daemon --stacktrace

      - name: Compile test sources
        run: ./gradlew compileTestJava --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Upload VigilAC.jar
        uses: actions/upload-artifact@v4
        with:
          name: VigilAC
          path: build/libs/VigilAC.jar
          if-no-files-found: error
